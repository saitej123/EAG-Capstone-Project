<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Multimodal Studio</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/static/favicon-256.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    (function () {
      try {
        var m = localStorage.getItem("cc-theme");
        if (!m) m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (m === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="logo"><i data-lucide="clapperboard"></i></span>
        <div>
          <div class="auth-title">Multimodal Studio</div>
          <div class="auth-sub">Turn your knowledge into narrated, publish-ready videos.</div>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <div class="auth-msg hidden" id="auth-msg"></div>

      <!-- Login -->
      <form class="auth-form" id="pane-login" data-pane="login">
        <label class="auth-label">Email or username</label>
        <input class="auth-input" id="si-id" type="text" autocomplete="username" placeholder="you@example.com" />
        <label class="auth-label">Password</label>
        <input class="auth-input" id="si-pw" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button class="auth-btn" type="submit"><i data-lucide="log-in"></i> Login</button>
      </form>

      <!-- Register — submits for admin review; completes only after approval -->
      <form class="auth-form hidden" id="pane-register" data-pane="register">
        <div class="auth-hint">Your account will be reviewed by an admin before you can sign in.</div>
        <label class="auth-label">Email</label>
        <input class="auth-input" id="rg-email" type="email" autocomplete="email" placeholder="you@example.com" />
        <label class="auth-label">Display name <span class="auth-opt">(optional)</span></label>
        <input class="auth-input" id="rg-name" type="text" placeholder="Your name" />
        <label class="auth-label">Password <span class="auth-opt">(after approval)</span></label>
        <input class="auth-input" id="rg-pw" type="password" autocomplete="new-password" placeholder="Leave blank until approved" />
        <button class="auth-btn" type="submit"><i data-lucide="user-plus"></i> Create account</button>
      </form>

      <div class="auth-foot">Multimodal Studio · All rights reserved &copy;2026 · s.ai</div>
    </div>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
